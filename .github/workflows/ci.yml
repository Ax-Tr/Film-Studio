name: Required checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundaries, lint, types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v5
        with:
          name: skeleton-builds-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            backend/dist
            frontend/.next/standalone
            frontend/.next/static
            workers/jobs/dist

  dependency-audit:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: anchore/sbom-action@v0
        with:
          artifact-name: film-studio-sbom.cyclonedx.json
          format: cyclonedx-json
          output-file: artifacts/film-studio-sbom.cyclonedx.json
          path: .
